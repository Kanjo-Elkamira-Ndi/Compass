server:
  port: 8080

spring:
  application:
    name: compass-advisor

  datasource:
    url: jdbc:postgresql://localhost:5432/compass_ai
    username: postgres
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5

  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 11

  data:
    redis:
      url: redis://localhost:6379

  ai:
    active-provider: openai
    openai:
      api-key: ${GROQ_API_KEY}
      base-url: https://api.groq.com/openai
      chat:
        options:
          model: llama-3.3-70b-versatile

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

app:
  jwt:
    secret: dev-only-change-in-production-minimum-256-bits-required-for-hs256-algorithm
    access-token-expiration-ms: 900000
    refresh-token-expiration-days: 7
  cors:
    allowed-origins: http://localhost:5173,http://localhost:3000
  ai:
    openai:
      api-key:
    gemini:
      api-key:
    tavily:
      api-key: ${TAVILY_API_KEY:}
