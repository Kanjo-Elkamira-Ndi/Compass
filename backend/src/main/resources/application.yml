server:
  port: 8080

spring:
  application:
    name: compass-advisor

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/compass_ai}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5

  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 11

  servlet:
    multipart:
      # 25MB covers the largest single upload (research PDFs); 60MB covers the
      # worst-case complaint submission (5 attachments x 10MB each).
      max-file-size: 25MB
      max-request-size: 60MB

  data:
    redis:
      url: ${REDIS_URL:redis://localhost:6379}

  ai:
    active-provider: openai
    openai:
      api-key: ${GROQ_API_KEY}
      base-url: https://api.groq.com/openai
      chat:
        options:
          model: llama-3.3-70b-versatile

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

app:
  jwt:
    secret: ${JWT_SECRET:dev-only-change-in-production-minimum-256-bits-required-for-hs256-algorithm}
    access-token-expiration-ms: 900000
    refresh-token-expiration-days: 7
  transcript:
    signing-secret: ${TRANSCRIPT_SIGNING_SECRET:dev-only-transcript-signing-secret-256-bits-minimum}
    token-ttl-days: 90
  cors:
    allowed-origins: http://localhost:5173,http://localhost:3000
  complaints:
    upload-dir: ${COMPLAINT_UPLOAD_DIR:./uploads/complaints}
  ai:
    openai:
      api-key:
    gemini:
      api-key:
    tavily:
      api-key: ${TAVILY_API_KEY:}
