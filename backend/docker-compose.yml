services:
  postgres-db:
    image: pgvector/pgvector:pg16
    container_name: postgres-db
    ports:
      # Bound to localhost only — on a host with a public IP (e.g. the AWS
      # instance), a bare "5433:5432" mapping is reachable from the whole
      # internet behind just this password.
      - "127.0.0.1:5433:5432"
    environment:
      POSTGRES_DB: compass_ai
      POSTGRES_USER: ${DB_USER:-advisor}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-advisor_dev}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-advisor} -d advisor"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis-cache:
    image: redis:7-alpine
    container_name: redis-cache
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
